[project]
name = "agents"
version = "0.1.0"
description = "Multi-agent system: Router, Vulnerability Expert, Systems Expert, Writer, Evaluator"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6",
    "langgraph>=1.2.22",
    "mcps",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

# This makes every agent folder importable from anywhere in the project,
# e.g.  from writer.agent import run
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Run the tests from the project root with:  uv run --project agents pytest
# The tests live in a package next to this folder (../tests).
# pythonpath = ["."] makes them import the code in this folder (the one you edit),
# not a built copy that uv may have installed.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]

# The MCP clients live in their own folder next to agents/ (see ../mcps/README.md).
[tool.uv.sources]
mcps = { path = "../mcps", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["shared", "router", "vulnerability_expert", "systems_expert", "writer", "evaluator"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
