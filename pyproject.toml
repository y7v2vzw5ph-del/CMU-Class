[project]
name = "aiclass-pythoncode"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
    "torch>=2.5.0",
    "transformers>=5.22.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
