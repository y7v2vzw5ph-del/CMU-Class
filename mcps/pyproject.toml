[project]
name = "mcps"
version = "0.1.0"
description = "Shared MCP clients, one module per MCP. See README.md."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6",
    "python-dotenv>=1.2.4",
]

# The package is the folder mcps/mcps/, so agents import it as:  from mcps.cve import CveTool
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
